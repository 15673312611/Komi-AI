<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#F8FAFC">
  <script>
    /* Applies the saved theme before first paint.
       Keep the key and the two colours in step with src/composables/useTheme.ts
       and src/config/themeColors.ts */
    (function () {
      try {
        var stored = localStorage.getItem('cm-theme') || 'light';
        var resolved = stored === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : (stored === 'dark' ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', resolved);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', resolved === 'dark' ? '#090A0F' : '#F8FAFC');
      } catch (e) {
        /* Private mode can throw on localStorage; light default applies. */
      }
    })();
  </script>
  <!-- iOS installed-PWA (Add to Home Screen) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Komi AI">
  <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome 6 Pro Icons (Aligned with workbench_v2.html, Multi-CDN Resilient) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" onerror="this.onerror=null;this.href='https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css';">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
  <script>
    document.addEventListener('error', function(e) {
      if (e.target && e.target.tagName === 'IMG') {
        var alt = e.target.alt || 'CM';
        var initial = (alt.split(' ').map(function(n){return n[0];}).join('') || 'CM').toUpperCase().slice(0, 2);
        e.target.onerror = null;
        e.target.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80"><rect width="80" height="80" rx="16" fill="%231E293B"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="28" fill="%2394A3B8">' + initial + '</text></svg>';
      }
    }, true);
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.tailwind) {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#ecfdf5',
                100: '#d1fae5',
                300: '#6ee7b7',
                400: '#34d399',
                500: '#10b981',
                600: '#059669',
                glow: '#00F29D'
              },
              obsidian: {
                950: '#080B11',
                900: '#0C101A',
                850: '#0F1523',
                800: '#131B2E',
                750: '#18223B',
                700: '#1E2B4A',
                border: 'rgba(255, 255, 255, 0.06)',
                borderLight: 'rgba(255, 255, 255, 0.1)',
                borderEmerald: 'rgba(16, 185, 129, 0.35)'
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace']
            }
          }
        }
      }
    }
  </script>
  <title>Komi AI · 多渠道跨境电商智能客服</title>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      if (params.has('shop') || params.has('host')) {
        var s1 = document.createElement('script');
        s1.src = 'https://cdn.shopify.com/shopifycloud/app-bridge.js';
        document.head.appendChild(s1);
        var s2 = document.createElement('script');
        s2.src = 'https://cdn.shopify.com/shopifycloud/polaris.js';
        document.head.appendChild(s2);
      }
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <script src="/config.js"></script>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
